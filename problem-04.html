    <p>
        (a+b)<sup>2</sup> = a<sup>2</sup> + b<sup>2</sup>+ 2ab
    </p>
    <p>
        (a-b)<sup>2</sup> = a<sup>2</sup> + b<sup>2</sup> -2ab 
    </p>
    <p>
        a<sup>2</sup> + b<sup>2</sup> = (a-b)(a+b)
    </p>

    </p>
    <p>
        Pythagoras Theorem: c<sup>2</sup> = a<sup>2</sup> + b<sup>2</sup>
    </p>

        Volume of a cube = a<sup>3</sup>
    </p>

    </p>
    <p>
        n<sub>th</sub> term of a sequence is = a(n-1)d
    </p>
